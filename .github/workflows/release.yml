name: "Build & Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.6)'
        required: true

permissions:
  contents: write

jobs:
  # ==========================================
  # Android: arm64-v8a / armeabi-v7a / Universal APK
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，本次产物将使用 debug 签名（用户无法覆盖安装升级）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobili-release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mobili-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Only the two ARM split APKs and the Universal (all-ABI) APK are built.
      - name: Build APKs (arm64-v8a, armeabi-v7a, Universal)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release

      - name: Organize Android artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "artifacts/MoBili-Android-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "artifacts/MoBili-Android-armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "artifacts/MoBili-Android-Universal.apk"
          ls -lh artifacts

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*

  # ==========================================
  # Publish: Android APK to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all release files
        run: ls -la release-artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: 墨哩 ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}