name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android: 32位 / 64位 / 通用 APK / AAB
  # ==========================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Split per ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Organize Android artifacts
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p artifacts
          
          # Copy Split APKs
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "artifacts/MoBili-Android-armeabi-v7a-${VERSION}.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "artifacts/MoBili-Android-arm64-v8a-${VERSION}.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-x86_64-release.apk" "artifacts/MoBili-Android-x86_64-${VERSION}.apk"
          fi
          
          # Copy Universal APK
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "artifacts/MoBili-Android-Universal-${VERSION}.apk"
          fi
          
          # Copy AAB Bundle
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "build/app/outputs/bundle/release/app-release.aab" "artifacts/MoBili-Android-${VERSION}.aab"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*

  # ==========================================
  # 2. macOS: .dmg 镜像包 & .zip 压缩包
  # ==========================================
  build-macos:
    name: Build macOS (DMG & ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Artifacts (DMG & ZIP)
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p artifacts
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            APP_NAME=$(basename "$APP_PATH")
            
            # 1. Package ZIP
            cd "$APP_DIR"
            zip -r -y "../../../../../artifacts/MoBili-macOS-${VERSION}.zip" "$APP_NAME"
            cd -
            
            # 2. Package DMG
            create-dmg \
              --volname "MoBili" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "$APP_NAME" 150 190 \
              --hide-extension "$APP_NAME" \
              --app-drop-link 450 185 \
              "artifacts/MoBili-macOS-${VERSION}.dmg" \
              "$APP_PATH" || \
            hdiutil create -volname "MoBili" -srcfolder "$APP_PATH" -ov -format UDZO "artifacts/MoBili-macOS-${VERSION}.dmg"
          else
            echo "Error: macOS .app bundle not found."
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/MoBili-macOS-*

  # ==========================================
  # 3. Windows: .exe 安装包 & 绿色 Zip 包
  # ==========================================
  build-windows:
    name: Build Windows (EXE & ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Artifacts (EXE Setup & ZIP)
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $VERSION_NUM = $VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force -Path "artifacts"
          
          # 1. Locate the executable directory
          $exe = Get-ChildItem -Path "build\windows" -Recurse -Filter "mobili.exe" | Select-Object -First 1
          if (-not $exe) {
              $exe = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" | Where-Object { $_.FullName -notmatch "\.dir" -and $_.FullName -notmatch "CMakeFiles" } | Select-Object -First 1
          }
          if (-not $exe) {
              Write-Error "Windows executable not found in build directory."
              exit 1
          }
          
          $releasePath = $exe.Directory.FullName
          Write-Host "Found release directory: $releasePath"
          $artifactsPath = (Resolve-Path "artifacts").Path
          
          # 2. Package Portable ZIP
          Compress-Archive -Path "$releasePath\*" -DestinationPath "artifacts\MoBili-Windows-x64-$VERSION.zip"
          
          # 3. Compile Inno Setup EXE Installer
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
              choco install innosetup -y
          }
          if (Test-Path $isccPath) {
              & $isccPath /DMyAppVersion="$VERSION_NUM" /DSourceDir="$releasePath" /DOutputDir="$artifactsPath" windows\packaging\installer.iss
          } else {
              Write-Warning "Inno Setup compiler not found, skipping EXE installer creation."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/MoBili-Windows-*

  # ==========================================
  # 4. Linux: .deb 安装包 & .tar.gz 运行包
  # ==========================================
  build-linux:
    name: Build Linux (DEB & Tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Artifacts (DEB & Tar.gz)
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          mkdir -p artifacts
          BUNDLE_DIR=$(find build/linux -type d -name "bundle" | head -n 1)
          
          if [ -n "$BUNDLE_DIR" ]; then
            # 1. Package .tar.gz
            tar -czvf "artifacts/MoBili-Linux-x64-${VERSION}.tar.gz" -C "$BUNDLE_DIR" .
            
            # 2. Package .deb
            DEB_DIR="deb_package"
            mkdir -p "$DEB_DIR/DEBIAN"
            mkdir -p "$DEB_DIR/usr/lib/mobili"
            mkdir -p "$DEB_DIR/usr/bin"
            mkdir -p "$DEB_DIR/usr/share/applications"
            mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
            
            cp -r "$BUNDLE_DIR"/* "$DEB_DIR/usr/lib/mobili/"
            
            # Create symlink launcher
            cat << 'SH_EOF' > "$DEB_DIR/usr/bin/mobili"
#!/bin/sh
exec /usr/lib/mobili/mobili "$@"
SH_EOF
            chmod +x "$DEB_DIR/usr/bin/mobili"
            
            # Create desktop entry
            cat << 'DESKTOP_EOF' > "$DEB_DIR/usr/share/applications/mobili.desktop"
[Desktop Entry]
Name=MoBili
Comment=水墨禅意 · 哔哩哔哩第三方客户端
Exec=/usr/bin/mobili
Icon=mobili
Terminal=false
Type=Application
Categories=AudioVideo;Video;Player;
DESKTOP_EOF
            
            if [ -f "assets/icons/app_icon.png" ]; then
              cp "assets/icons/app_icon.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/mobili.png"
            fi
            
            # Control file
            cat << CONTROL_EOF > "$DEB_DIR/DEBIAN/control"
Package: mobili
Version: ${VERSION_NUM}
Architecture: amd64
Maintainer: MoBili Authors <https://github.com/e69d8e/MoBili>
Description: 墨哩 (MoBili) - 水墨禅意 · 哔哩哔哩第三方客户端
 A modern, elegant third-party Bilibili client crafted with Zen ink aesthetics.
Section: video
Priority: optional
CONTROL_EOF
            
            dpkg-deb --build "$DEB_DIR" "artifacts/MoBili-Linux-x64-${VERSION}.deb"
            rm -rf "$DEB_DIR"
          else
            echo "Error: Linux release bundle directory not found."
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/MoBili-Linux-*

  # ==========================================
  # 5. Publish: Aggregate & Publish to Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all release files
        run: ls -la release-artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
